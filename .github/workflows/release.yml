# Builds every artifact on a version tag (v1.2.3) and attaches the installer and the portable zip to a
# DRAFT GitHub release. The MSIX stays in the build artifact: it is uploaded to the Microsoft Store,
# which signs it; unsigned, it cannot be installed from a GitHub download.
# Nothing is published until you open the draft and click "Publish release".
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Get build tools (AutoHotkey, makeappx, Inno Setup)
        shell: pwsh
        run: ./build/get-tools.ps1

      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Version ${{ steps.v.outputs.version }} -RepoUrl "https://github.com/${{ github.repository }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskbar-pull-${{ steps.v.outputs.version }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msix
            dist/SHA256SUMS.txt
            dist/winget/**

      - name: Draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.v.outputs.version }}'
          $notes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -like "$v*" } | Select-Object -First 1
          Set-Content notes.md ("## " + $notes)
          gh release create "v$v" --draft --title "Taskbar Pull $v" --notes-file notes.md `
            dist/TaskbarPull-$v-setup.exe dist/TaskbarPull-$v-portable.zip dist/SHA256SUMS.txt
